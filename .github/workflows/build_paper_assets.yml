name: Build paper assets

on:
  push:
    branches: [main]
    paths:
      - "src/stage_05_publication.py"
      - ".github/workflows/build_paper_assets.yml"

permissions:
  contents: write

concurrency:
  group: pnad-paper-assets-main
  cancel-in-progress: true

jobs:
  paper-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Add observation-year vertical guides
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/stage_05_publication.py")
          text = path.read_text()

          text = text.replace(
              "    x_tick_start=None,\n    x_tick_step=None,\n):",
              "    x_tick_start=None,\n    x_tick_step=None,\n    observation_guides=False,\n):",
              1,
          )

          old = (
              "    if title:\n"
              "        ax.set_title(title, fontsize=10.0)\n"
              "    style(ax)\n"
              "    if series:"
          )
          new = (
              "    if title:\n"
              "        ax.set_title(title, fontsize=10.0)\n"
              "    style(ax)\n"
              "    if observation_guides:\n"
              "        finite_mask = np.zeros(len(data), dtype=bool)\n"
              "        for column, _ in series:\n"
              "            finite_mask |= np.isfinite(pd.to_numeric(data[column], errors=\"coerce\").to_numpy(float))\n"
              "        major_ticks = np.asarray(ax.get_xticks(), dtype=float)\n"
              "        for year in data.loc[finite_mask, \"year\"].astype(int):\n"
              "            if not np.any(np.isclose(major_ticks, year)):\n"
              "                ax.axvline(year, color=\"0.82\", lw=0.55, ls=\"--\", alpha=0.75, zorder=0)\n"
              "    if series:"
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif "if observation_guides:" not in text:
              raise SystemExit("line_figure block not found")

          anchor = "        x_tick_step=5,\n    )"
          replacement = "        x_tick_step=5,\n        observation_guides=True,\n    )"
          count = text.count(anchor)
          if count < 3:
              raise SystemExit(f"Expected three quinquennial line_figure calls, found {count}")
          text = text.replace(anchor, replacement, 3)

          old_gini = (
              "    ax.set_xticks(np.arange(1975, END_YEAR + 1, 5))\n"
              "    style(ax)\n"
              "    ax.legend(loc=\"best\", ncol=3, handlelength=2.5)"
          )
          new_gini = (
              "    ax.set_xticks(np.arange(1975, END_YEAR + 1, 5))\n"
              "    style(ax)\n"
              "    guide_columns = [c for c in (\"Gini\", \"IPEA\", \"Banco_Mundial\") if c in gini_validation]\n"
              "    guide_mask = gini_validation[guide_columns].notna().any(axis=1)\n"
              "    major_ticks = np.asarray(ax.get_xticks(), dtype=float)\n"
              "    for year in gini_validation.loc[guide_mask, \"year\"].astype(int):\n"
              "        if not np.any(np.isclose(major_ticks, year)):\n"
              "            ax.axvline(year, color=\"0.82\", lw=0.55, ls=\"--\", alpha=0.75, zorder=0)\n"
              "    ax.legend(loc=\"best\", ncol=3, handlelength=2.5)"
          )
          if old_gini in text:
              text = text.replace(old_gini, new_gini, 1)
          elif "guide_mask = gini_validation[guide_columns].notna().any(axis=1)" not in text:
              raise SystemExit("Gini validation block not found")

          required = [
              "observation_guides=False",
              "observation_guides=True",
              "for year in data.loc[finite_mask, \"year\"].astype(int):",
              "for year in gini_validation.loc[guide_mask, \"year\"].astype(int):",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Patch incomplete: {missing}")
          path.write_text(text)
          PY

      - name: Build Stage 05 publication assets
        env:
          MPLBACKEND: Agg
        run: python src/stage_05_publication.py

      - name: Commit paper assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stage_05_publication.py assets/figures_paper assets/tables_paper
          if ! git diff --cached --quiet; then
            git commit -m "generate paper assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
