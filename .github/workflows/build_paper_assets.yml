name: Build paper assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/stage_05_moura_ribeiro.py"
      - "data/refined/**"
      - "data/metadata/df_metadata.xlsx"
      - "data/auxiliary/gdp_growth_brazil_1978_2025.csv"
      - "assets/tables_analysis_refined/**"
      - "requirements.txt"
      - ".github/workflows/build_paper_assets.yml"

permissions:
  contents: write

jobs:
  paper-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Moura-Ribeiro paper assets
        env:
          MPLBACKEND: Agg
        run: python src/stage_05_moura_ribeiro.py

      - name: Upload paper assets
        uses: actions/upload-artifact@v4
        with:
          name: paper-assets
          path: |
            assets/figures_paper/**
            assets/tables_paper/**
          if-no-files-found: error

      - name: Commit paper assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/figures_paper assets/tables_paper
          if git diff --cached --quiet; then
            echo "No paper-asset changes to commit."
          else
            git commit -m "generate paper assets"
            git push
          fi
