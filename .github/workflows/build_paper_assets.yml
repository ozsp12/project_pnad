name: Build paper assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/stage_05_moura_ribeiro.py"
      - "src/stage_05_paper_figures.py"
      - "data/trusted/**"
      - "data/refined/**"
      - "data/auxiliary/gdp_growth_brazil_1978_2025.csv"
      - "data/metadata/df_metadata.xlsx"
      - "assets/tables_analysis_refined/**"
      - "requirements.txt"
      - ".github/workflows/build_paper_assets.yml"

permissions:
  contents: write

jobs:
  paper-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Moura-Ribeiro paper assets
        env:
          MPLBACKEND: Agg
        run: |
          python src/stage_05_moura_ribeiro.py
          python src/stage_05_paper_figures.py

      - name: Enforce SVG-only paper figures
        run: |
          find assets/figures_paper -type f -name '*.pdf' -delete
          if find assets/figures_paper -type f -name 'moura_ribeiro_2009_*' | grep -q .; then
            echo "Legacy figure filename prefix still present."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path("assets/tables_paper/moura_ribeiro_2009_replication_manifest_trusted.csv")
          if path.exists():
              manifest = pd.read_csv(path)
              if "pdf" in manifest.columns:
                  manifest = manifest.drop(columns=["pdf"])
              if {"asset_type", "stem", "svg"}.issubset(manifest.columns):
                  figure_mask = manifest["asset_type"].eq("figure")
                  manifest.loc[figure_mask, "stem"] = manifest.loc[figure_mask, "stem"].str.removeprefix("moura_ribeiro_2009_")
                  manifest.loc[figure_mask, "svg"] = manifest.loc[figure_mask, "svg"].str.removeprefix("moura_ribeiro_2009_")
              manifest.to_csv(path, index=False)
          PY

      - name: Upload paper assets
        uses: actions/upload-artifact@v4
        with:
          name: paper-assets
          path: |
            assets/figures_paper/**
            assets/tables_paper/**
          if-no-files-found: error

      - name: Commit paper assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/figures_paper assets/tables_paper
          if git diff --cached --quiet; then
            echo "No paper-asset changes to commit."
          else
            git commit -m "generate paper assets"
            git push
          fi
