name: Restore Stage 03 tables

on:
  push:
    branches: ["refactor/stage03-png-figures"]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message == 'run restore Stage 03 tables'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stage03-png-figures
          fetch-depth: 0
      - name: Restore table assets from main
        run: |
          git fetch origin main
          git checkout origin/main -- assets/tables_analysis_refined assets/tables_analysis_trusted
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/tables_analysis_refined assets/tables_analysis_trusted
          if git diff --cached --quiet; then
            echo "No table changes to restore."
          else
            git commit -m "restore unchanged Stage 03 tables"
            git push origin HEAD:refactor/stage03-png-figures
          fi
