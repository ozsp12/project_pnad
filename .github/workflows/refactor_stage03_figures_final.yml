name: Apply final Stage 03 figure refactor

on:
  push:
    branches: ["refactor/stage03-png-figures"]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'run final Stage 03 figure refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/stage03-png-figures

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply refactor
        run: |
          python tools/refactor_stage03_figures_tmp.py
          rm -rf assets/figures_synthetic assets/tables_synthetic
          rm -f tools/refactor_stage03_figures_tmp.py

      - name: Persist source refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/stage_03_pnad_analysis.py README.md src/README.md assets/README.md tools
          git add -A assets/figures_synthetic assets/tables_synthetic
          git commit -m "refactor Stage 03 analytical figures"
          git push origin HEAD:refactor/stage03-png-figures

      - name: Validate source
        env:
          MPLBACKEND: Agg
        run: |
          python -m compileall -q src
          pytest -q

      - name: Generate Stage 03 PNG assets
        env:
          MPLBACKEND: Agg
        run: python src/stage_03_pnad_analysis.py

      - name: Commit generated assets
        run: |
          git add -A assets/figures_analysis_trusted assets/figures_analysis_refined
          git add -A assets/tables_analysis_trusted assets/tables_analysis_refined
          if git diff --cached --quiet; then
            echo "No generated analysis changes to commit."
          else
            git commit -m "generate Stage 03 PNG assets"
            git push origin HEAD:refactor/stage03-png-figures
          fi
