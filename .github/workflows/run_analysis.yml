name: Run PNAD analysis

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build trusted PNAD"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "src/stage_03_pnad_analysis.py"
      - "data/metadata/df_metadata.xlsx"
      - "data/auxiliary/**"
      - "requirements.txt"
      - ".github/workflows/run_analysis.yml"

permissions:
  contents: write

concurrency:
  group: pnad-analysis-main
  cancel-in-progress: true

jobs:
  analysis:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refine inequality grid year axes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/stage_03_pnad_analysis.py")
          text = path.read_text()
          old = '''    fig, axes = plt.subplots(2, ncols, figsize=figsize, squeeze=False, sharex=True)\n    first = int(df["year"].min())\n    last = int(df["year"].max())\n    years = np.arange(first, last + 1)'''
          new = '''    fig, axes = plt.subplots(2, ncols, figsize=figsize, squeeze=False, sharex=False)\n    first = int(df["year"].min())\n    last = int(df["year"].max())\n    axis_start = 1975\n    years = np.arange(first, last + 1)'''
          old_axis = '''        ax.set_xlabel("Year")\n        ax.set_ylabel(ylabel)\n        ax.grid(True, alpha=0.4)'''
          new_axis = '''        ax.set_xlabel("Year")\n        ax.set_ylabel(ylabel)\n        ax.set_xlim(axis_start, last)\n        ax.set_xticks(np.arange(axis_start, last + 1, 5))\n        ax.tick_params(axis="x", labelbottom=True)\n        ax.grid(True, alpha=0.4)'''
          changed = False
          if old in text:
              text = text.replace(old, new, 1)
              changed = True
          elif new not in text:
              raise SystemExit("Inequality grid setup block not found")
          if old_axis in text:
              text = text.replace(old_axis, new_axis, 1)
              changed = True
          elif new_axis not in text:
              raise SystemExit("Inequality grid axis block not found")
          if changed:
              path.write_text(text)
          PY

      - name: Ensure analysis datasets exist
        shell: bash
        run: |
          if ! compgen -G "data/trusted/pnad_trusted_*.parquet" > /dev/null; then
            echo "Trusted datasets are required and are not rebuilt by the analysis workflow."
            exit 1
          fi
          if ! compgen -G "data/refined/pnad_refined_*.parquet" > /dev/null; then
            echo "Refined datasets are required and are not rebuilt by the analysis workflow."
            exit 1
          fi
          echo "Refined and trusted datasets are present."

      - name: Prepare analysis asset directories
        run: |
          mkdir -p assets/figures_analysis_trusted assets/figures_analysis_refined
          mkdir -p assets/tables_analysis_trusted assets/tables_analysis_refined
          find assets/figures_analysis_trusted -maxdepth 1 -type f -name "*.svg" -delete
          find assets/figures_analysis_refined -maxdepth 1 -type f -name "*.svg" -delete
          find assets/figures_analysis_trusted -maxdepth 1 -type f -name "*_analysis_*.png" -delete
          find assets/figures_analysis_refined -maxdepth 1 -type f -name "*_analysis_*.png" -delete
          rm -f assets/figures_analysis_trusted/ccdf_lnln.png
          rm -f assets/figures_analysis_refined/ccdf_lnln.png

      - name: Run complete PNAD Stage 03
        env:
          MPLBACKEND: Agg
        run: python src/stage_03_pnad_analysis.py

      - name: Commit analytical assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stage_03_pnad_analysis.py
          git add -A assets/figures_analysis_trusted assets/figures_analysis_refined
          git add -A assets/tables_analysis_trusted assets/tables_analysis_refined
          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
          else
            git commit -m "generate PNAD analysis assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
