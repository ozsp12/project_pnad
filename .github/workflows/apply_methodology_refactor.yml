name: Apply methodology refactor

on:
  push:
    branches: [refactor/methodology-integrity]
    paths:
      - "tools/apply_methodology_refactor.py"
      - ".github/workflows/apply_methodology_refactor.yml"

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/methodology-integrity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Apply refactor
        run: python tools/apply_methodology_refactor.py

      - name: Normalize test import path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_methodology_integrity.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from pathlib import Path\nimport inspect\n\n",
              "from pathlib import Path\nimport inspect\nimport sys\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\n",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall src

      - name: Run tests
        run: pytest -q

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md tests
          if git diff --cached --quiet; then
            echo "No refactor changes to commit."
          else
            git commit -m "refactor methodology integrity"
            git push origin HEAD:refactor/methodology-integrity
          fi
