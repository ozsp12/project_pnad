name: Build paper assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/stage_04_pereira_ribeiro.py"
      - "src/stage_05_moura_ribeiro.py"
      - "data/data_trusted/**"
      - "requirements.txt"
      - ".github/workflows/build_paper_assets.yml"

permissions:
  contents: write

jobs:
  paper-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Pereira-Ribeiro paper assets
        if: ${{ hashFiles('src/stage_04_pereira_ribeiro.py') != '' }}
        env:
          MPLBACKEND: Agg
        run: python src/stage_04_pereira_ribeiro.py

      - name: Generate Moura-Ribeiro paper assets
        if: ${{ hashFiles('src/stage_05_moura_ribeiro.py') != '' }}
        env:
          MPLBACKEND: Agg
        run: python src/stage_05_moura_ribeiro.py

      - name: Commit paper assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/figures_paper assets/tables_paper
          if git diff --cached --quiet; then
            echo "No paper-asset changes to commit."
          else
            git commit -m "generate paper assets"
            git push
          fi
