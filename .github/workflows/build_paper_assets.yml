name: Build paper assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/stage_05_moura_ribeiro.py"
      - "src/paper_figures.py"
      - "data/trusted/**"
      - "data/refined/**"
      - "data/auxiliary/gdp_growth_brazil_1978_2025.csv"
      - "data/metadata/df_metadata.xlsx"
      - "assets/tables_analysis_refined/**"
      - "assets/tables_analysis_trusted/**"
      - "requirements.txt"
      - ".github/workflows/build_paper_assets.yml"

permissions:
  contents: write

jobs:
  paper-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Moura-Ribeiro paper assets
        env:
          MPLBACKEND: Agg
        run: python src/stage_05_moura_ribeiro.py

      - name: Finalize paper figures
        env:
          MPLBACKEND: Agg
        run: python src/paper_figures.py

      - name: Enforce PNG-only paper figures and manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from PIL import Image

          figures_dir = Path("assets/figures_paper")
          unexpected = sorted(
              path.name
              for path in figures_dir.iterdir()
              if path.is_file() and path.name != ".gitkeep" and path.suffix.lower() != ".png"
          )
          if unexpected:
              raise SystemExit(f"Non-PNG paper figures found: {unexpected}")

          figures = sorted(figures_dir.glob("*.png"))
          if not figures:
              raise SystemExit("No PNG paper figures were generated")
          for figure in figures:
              with Image.open(figure) as image:
                  if image.format != "PNG":
                      raise SystemExit(f"Invalid PNG file: {figure}")
                  image.verify()

          manifest_path = Path(
              "assets/tables_paper/moura_ribeiro_2009_replication_manifest_trusted.csv"
          )
          manifest = pd.read_csv(manifest_path).fillna("")
          if "png" not in manifest.columns or "svg" in manifest.columns:
              raise SystemExit("Trusted manifest must contain png and must not contain svg")
          referenced = set(manifest.loc[manifest["asset_type"] == "figure", "png"])
          generated = {path.name for path in figures}
          if referenced != generated:
              raise SystemExit(
                  f"Manifest/figure mismatch: missing={sorted(referenced - generated)}, "
                  f"unlisted={sorted(generated - referenced)}"
              )

          replication_path = Path(
              "assets/tables_paper/moura_ribeiro_2009_replication_manifest.csv"
          )
          replication = pd.read_csv(replication_path).fillna("")
          missing = []
          for filename in replication["filename"]:
              base = figures_dir if str(filename).endswith(".png") else replication_path.parent
              if not (base / str(filename)).is_file():
                  missing.append(str(filename))
          if missing:
              raise SystemExit(f"Replication manifest references missing assets: {missing}")
          PY

      - name: Upload paper assets
        uses: actions/upload-artifact@v4
        with:
          name: paper-assets
          path: |
            assets/figures_paper/**
            assets/tables_paper/**
          if-no-files-found: error

      - name: Commit paper assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/figures_paper assets/tables_paper
          if git diff --cached --quiet; then
            echo "No paper-asset changes to commit."
          else
            git commit -m "generate paper assets"
            git push
          fi
