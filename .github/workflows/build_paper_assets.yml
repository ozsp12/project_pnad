name: Build paper assets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/stage_05_moura_ribeiro.py"
      - "src/paper_figures.py"
      - "src/paper_tables.py"
      - "data/trusted/**"
      - "data/auxiliary/gdp_growth_brazil_1978_2025.csv"
      - "data/auxiliary/series_gini_ipea_banco_mundial.csv"
      - "data/metadata/df_metadata.xlsx"
      - "assets/tables_analysis_trusted/**"
      - "requirements.txt"
      - ".github/workflows/build_paper_assets.yml"
  push:
    branches: [main]
    paths:
      - "src/stage_05_moura_ribeiro.py"
      - "src/paper_figures.py"
      - "src/paper_tables.py"
      - "data/trusted/**"
      - "data/auxiliary/gdp_growth_brazil_1978_2025.csv"
      - "data/auxiliary/series_gini_ipea_banco_mundial.csv"
      - "data/metadata/df_metadata.xlsx"
      - "assets/tables_analysis_trusted/**"
      - "requirements.txt"
      - ".github/workflows/build_paper_assets.yml"

permissions:
  contents: write

jobs:
  paper-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate trusted paper fits and figures
        env:
          MPLBACKEND: Agg
        run: python src/stage_05_moura_ribeiro.py

      - name: Finalize paper figures
        env:
          MPLBACKEND: Agg
        run: python src/paper_figures.py

      - name: Build canonical paper tables
        run: python src/paper_tables.py

      - name: Validate canonical paper assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from PIL import Image

          figures_dir = Path("assets/figures_paper")
          tables_dir = Path("assets/tables_paper")

          unexpected_figures = sorted(
              path.name
              for path in figures_dir.iterdir()
              if path.is_file() and path.name != ".gitkeep" and path.suffix.lower() != ".png"
          )
          if unexpected_figures:
              raise SystemExit(f"Non-PNG paper figures found: {unexpected_figures}")
          figures = sorted(figures_dir.glob("*.png"))
          if not figures:
              raise SystemExit("No PNG paper figures were generated")
          for figure in figures:
              if figure.name.startswith("moura_ribeiro_2009_"):
                  raise SystemExit(f"Legacy figure prefix remains: {figure.name}")
              with Image.open(figure) as image:
                  if image.format != "PNG":
                      raise SystemExit(f"Invalid PNG file: {figure}")
                  image.verify()

          expected_tables = {
              "table_01_gompertz_annual.csv",
              "table_02_pareto_annual.csv",
              "table_03_economic_inequality_annual.csv",
              "table_04_metadata.csv",
          }
          generated_tables = {path.name for path in tables_dir.glob("*.csv")}
          if generated_tables != expected_tables:
              raise SystemExit(
                  f"Paper table set mismatch: expected={sorted(expected_tables)}, "
                  f"generated={sorted(generated_tables)}"
              )
          if any(name.startswith("moura_ribeiro_2009_") for name in generated_tables):
              raise SystemExit("Legacy Moura-Ribeiro prefix remains in paper tables")

          gompertz = pd.read_csv(tables_dir / "table_01_gompertz_annual.csv")
          pareto = pd.read_csv(tables_dir / "table_02_pareto_annual.csv")
          economic = pd.read_csv(tables_dir / "table_03_economic_inequality_annual.csv")
          metadata = pd.read_csv(tables_dir / "table_04_metadata.csv")

          required_gompertz = {
              "year", "gompertz_A", "gompertz_A_bootstrap_se", "gompertz_B",
              "gompertz_B_bootstrap_se", "gompertz_x_gmax", "transition_x_t",
              "gompertz_r2", "gompertz_correlation_coefficient",
              "gompertz_population_pct", "gompertz_income_share_pct", "bootstrap_reps",
          }
          required_pareto = {
              "year", "pareto_x_pmin", "transition_x_t", "transition_delta_x_t",
              "pareto_alpha_ls", "pareto_alpha_ls_bootstrap_se", "pareto_beta_ls",
              "pareto_beta_ls_bootstrap_se", "pareto_ls_r2",
              "pareto_ls_correlation_coefficient", "pareto_alpha_mle",
              "pareto_alpha_mle_fisher_se", "pareto_alpha_mle_bootstrap_se",
              "pareto_beta_mle_continuity", "pareto_beta_mle_bootstrap_se",
              "pareto_mle_r2", "pareto_mle_correlation_coefficient",
              "pareto_population_pct", "pareto_income_share_pct", "bootstrap_reps",
          }
          required_economic = {
              "year", "gdp_growth_pct", "income_observation_n", "income_mean_2025_usd",
              "income_median_2025_usd", "income_std_2025_usd", "gini_pnad",
              "pietra_pnad", "kolkata_pnad", "zanardi_pnad", "gini_ipea",
              "gini_world_bank", "p90_p99_income_share_pct",
              "p99_p999_income_share_pct", "p999_p100_income_share_pct",
          }
          for frame, required, name in [
              (gompertz, required_gompertz, "Gompertz"),
              (pareto, required_pareto, "Pareto"),
              (economic, required_economic, "economic/inequality"),
          ]:
              missing = sorted(required - set(frame.columns))
              if missing:
                  raise SystemExit(f"Missing {name} columns: {missing}")

          merged = gompertz[["year", "gompertz_income_share_pct"]].merge(
              pareto[["year", "pareto_income_share_pct"]], on="year", how="inner"
          )
          if not np.allclose(
              merged["gompertz_income_share_pct"] + merged["pareto_income_share_pct"],
              100.0,
              atol=1e-8,
          ):
              raise SystemExit("Gompertz/Pareto income shares do not sum to 100%")

          documented = set(zip(metadata["table_name"], metadata["column_name"]))
          for table_name, frame in [
              ("table_01_gompertz_annual.csv", gompertz),
              ("table_02_pareto_annual.csv", pareto),
              ("table_03_economic_inequality_annual.csv", economic),
          ]:
              missing_docs = [column for column in frame.columns if (table_name, column) not in documented]
              if missing_docs:
                  raise SystemExit(f"Undocumented columns in {table_name}: {missing_docs}")
          PY

      - name: Upload paper assets
        uses: actions/upload-artifact@v4
        with:
          name: paper-assets
          path: |
            assets/figures_paper/**
            assets/tables_paper/**
          if-no-files-found: error

      - name: Commit paper assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/figures_paper assets/tables_paper
          if git diff --cached --quiet; then
            echo "No paper-asset changes to commit."
          else
            git commit -m "generate paper assets"
            git push
          fi
