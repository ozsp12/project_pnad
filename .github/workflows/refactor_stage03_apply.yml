name: Apply Stage 03 cleanup

on:
  push:
    branches: ["refactor/stage03-low-risk-cleanup"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stage03-low-risk-cleanup

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply cleanup
        run: python tools/_apply_stage03_cleanup.py

      - name: Validate
        env:
          MPLBACKEND: Agg
        run: |
          python -m py_compile src/stage_03_pnad_analysis.py
          pip install -r requirements.txt
          pytest -q tests/test_stage_03_math.py tests/test_stage_03_gompertz_pareto.py tests/test_stage_03_uncertainty.py tests/test_methodology_integrity.py

      - name: Commit Stage 03 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stage_03_pnad_analysis.py
          if git diff --cached --quiet; then
            echo "No Stage 03 changes to commit."
          else
            git commit -m "refactor Stage 03 without changing analytical outputs"
            git push origin HEAD:refactor/stage03-low-risk-cleanup
          fi
