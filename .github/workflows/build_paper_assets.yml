name: Build paper assets

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Run PNAD analysis"]
    types: [completed]
  pull_request:
    paths:
      - "src/stage_05_publication.py"
      - "assets/tables_analysis_refined/**"
      - "assets/tables_analysis_trusted/**"
      - "requirements.txt"
      - ".github/workflows/build_paper_assets.yml"
  push:
    branches: [main]
    paths:
      - "src/stage_05_publication.py"
      - ".github/workflows/build_paper_assets.yml"

permissions:
  contents: write

concurrency:
  group: pnad-paper-assets-main
  cancel-in-progress: true

jobs:
  paper-assets:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure Stage 03 analytical tables exist
        shell: bash
        run: |
          test -f assets/tables_analysis_trusted/statistics_annual.csv
          test -f assets/tables_analysis_trusted/gompertz_annual.csv
          test -f assets/tables_analysis_trusted/pareto_annual.csv
          test -f assets/tables_analysis_trusted/gompertz_pareto_curves.csv
          test -f assets/tables_analysis_trusted/lorenz.csv

      - name: Add 40-50 percentile income-share series
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/stage_05_publication.py")
          text = path.read_text()

          text = text.replace(
              "def plot_misc(stats, annual):\n",
              "def plot_misc(stats, annual, lorenz):\n"
              "    middle_records = []\n"
              "    for year, data in lorenz.groupby(\"year\"):\n"
              "        population = data[\"population_share\"].to_numpy(float)\n"
              "        income = data[\"income_share\"].to_numpy(float)\n"
              "        share = float(np.interp(0.50, population, income) - np.interp(0.40, population, income))\n"
              "        middle_records.append({\"year\": int(year), \"p40_p50\": share})\n"
              "    middle = pd.DataFrame(middle_records)\n"
              "    stats = stats.merge(middle, on=\"year\", how=\"left\", validate=\"one_to_one\")\n",
              1,
          )

          text = text.replace(
              "        [(\"top_10\", \"Top 10%\"), (\"top_1\", \"Top 1%\"), (\"top_01\", \"Top 0.1%\")],\n"
              "        \"Income share (%)\",\n"
              "        100,\n"
              "        title=f\"Income concentration - Brazil ({START_YEAR}-{END_YEAR})\",\n"
              "        colors=[BLUE, DARK_RED, SALMON],\n"
              "        line_styles=[\"-\", \":\", \"-\"],\n"
              "        markers=[\"o\", \"s\", \"^\"],\n",
              "        [(\"p40_p50\", \"40-50%\"), (\"top_10\", \"Top 10%\"), (\"top_1\", \"Top 1%\"), (\"top_01\", \"Top 0.1%\")],\n"
              "        \"Income share (%)\",\n"
              "        100,\n"
              "        title=f\"Income concentration - Brazil ({START_YEAR}-{END_YEAR})\",\n"
              "        colors=[GREEN, BLUE, DARK_RED, SALMON],\n"
              "        line_styles=[\"-.\", \"-\", \":\", \"-\"],\n"
              "        markers=[\"D\", \"o\", \"s\", \"^\"],\n",
              1,
          )

          text = text.replace(
              "        [\n"
              "            (\"p90_p99\", \"90-99%\"),\n"
              "            (\"p99_p999\", \"99-99.9%\"),\n"
              "            (\"p999_p100\", \"99.9-100%\"),\n"
              "        ],\n"
              "        \"Income share (%)\",\n"
              "        100,\n"
              "        colors=[BLUE, ORANGE, RED],\n"
              "        line_styles=[\"-\", \"--\", \":\"],\n"
              "        markers=[\"o\", \"s\", \"^\"],\n",
              "        [\n"
              "            (\"p40_p50\", \"40-50%\"),\n"
              "            (\"p90_p99\", \"90-99%\"),\n"
              "            (\"p99_p999\", \"99-99.9%\"),\n"
              "            (\"p999_p100\", \"99.9-100%\"),\n"
              "        ],\n"
              "        \"Income share (%)\",\n"
              "        100,\n"
              "        colors=[GREEN, BLUE, ORANGE, RED],\n"
              "        line_styles=[\"-.\", \"-\", \"--\", \":\"],\n"
              "        markers=[\"D\", \"o\", \"s\", \"^\"],\n",
              1,
          )

          text = text.replace(
              "    plot_misc(stats, annual)\n",
              "    plot_misc(stats, annual, lorenz)\n",
              1,
          )

          required = [
              "def plot_misc(stats, annual, lorenz):",
              '"p40_p50": share',
              '("p40_p50", "40-50%")',
              "plot_misc(stats, annual, lorenz)",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"40-50 percentile patch incomplete: {missing}")
          path.write_text(text)
          PY

      - name: Build Stage 05 publication assets
        env:
          MPLBACKEND: Agg
        run: python src/stage_05_publication.py

      - name: Validate canonical paper assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from PIL import Image

          figures_dir = Path("assets/figures_paper")
          tables_dir = Path("assets/tables_paper")
          figures = sorted(figures_dir.glob("*.png"))
          if not figures:
              raise SystemExit("No PNG paper figures were generated")
          for figure in figures:
              with Image.open(figure) as image:
                  image.verify()

          expected = {
              "table_01_gompertz_annual.csv",
              "table_02_pareto_annual.csv",
              "table_03_economic_inequality_annual.csv",
              "table_04_metadata.csv",
          }
          generated = {p.name for p in tables_dir.glob("*.csv")}
          if generated != expected:
              raise SystemExit(f"Paper table set mismatch: {sorted(generated)}")

          gompertz = pd.read_csv(tables_dir / "table_01_gompertz_annual.csv")
          pareto = pd.read_csv(tables_dir / "table_02_pareto_annual.csv")
          economic = pd.read_csv(tables_dir / "table_03_economic_inequality_annual.csv")
          metadata = pd.read_csv(tables_dir / "table_04_metadata.csv")

          for name, frame in (
              ("Gompertz", gompertz),
              ("Pareto", pareto),
              ("economic", economic),
          ):
              years = set(pd.to_numeric(frame["year"], errors="coerce").dropna().astype(int))
              if not {1976, 1977}.issubset(years):
                  raise SystemExit(f"{name} paper table is missing 1976 or 1977")

          merged = gompertz[["year", "gompertz_income_share_pct"]].merge(
              pareto[["year", "pareto_income_share_pct", "pareto_selection_status"]],
              on="year",
              validate="one_to_one",
          )
          unsupported = merged["pareto_selection_status"].astype(str).str.startswith("unsupported_")
          supported = ~unsupported
          share_columns = ["gompertz_income_share_pct", "pareto_income_share_pct"]

          if merged.loc[supported, share_columns].isna().any().any():
              raise SystemExit("Supported Gompertz/Pareto regimes contain missing income shares")
          if supported.any() and not np.allclose(
              merged.loc[supported, "gompertz_income_share_pct"]
              + merged.loc[supported, "pareto_income_share_pct"],
              100.0,
              atol=1e-8,
          ):
              raise SystemExit("Supported Gompertz/Pareto income shares do not sum to 100%")
          if merged.loc[unsupported, share_columns].notna().any().any():
              raise SystemExit("Unsupported Pareto years must retain missing regime income shares")

          required_economic = {
              "income_observation_n",
              "income_mean_2025_usd",
              "p90_p99_income_share_pct",
              "p99_p999_income_share_pct",
              "p999_p100_income_share_pct",
          }
          if missing := required_economic - set(economic.columns):
              raise SystemExit(f"Missing economic columns: {sorted(missing)}")
          if economic[list(required_economic)].isna().any().any():
              raise SystemExit("Stage-03 economic summaries contain missing values")

          required_metadata = {
              "table_name", "table_description", "column_name",
              "description", "unit", "source",
          }
          if missing := required_metadata - set(metadata.columns):
              raise SystemExit(f"Missing metadata columns: {sorted(missing)}")
          if metadata["table_description"].isna().any():
              raise SystemExit("Missing table_description values")

          documented = set(zip(metadata["table_name"], metadata["column_name"]))
          for table_name, frame in (
              ("table_01_gompertz_annual.csv", gompertz),
              ("table_02_pareto_annual.csv", pareto),
              ("table_03_economic_inequality_annual.csv", economic),
          ):
              missing = [c for c in frame.columns if (table_name, c) not in documented]
              if missing:
                  raise SystemExit(f"Undocumented columns in {table_name}: {missing}")
          PY

      - name: Commit paper assets and source
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stage_05_publication.py assets/figures_paper assets/tables_paper
          if git diff --cached --quiet; then
            echo "No paper-asset changes to commit."
          else
            git commit -m "add 40-50 percentile income-share series"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
