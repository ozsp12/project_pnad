name: Apply methodology refactor

on:
  push:
    branches: [refactor/methodology-integrity]
    paths:
      - "tools/apply_methodology_refactor.py"
      - ".github/workflows/apply_methodology_refactor.yml"

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/methodology-integrity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Apply refactor
        run: python tools/apply_methodology_refactor.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall src

      - name: Run tests
        run: pytest -q

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md tests .github/workflows/run_analysis.yml
          if git diff --cached --quiet; then
            echo "No refactor changes to commit."
          else
            git commit -m "refactor methodology integrity"
            git push origin HEAD:refactor/methodology-integrity
          fi
