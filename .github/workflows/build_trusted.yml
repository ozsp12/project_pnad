name: Build trusted PNAD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/stage_02_build_trusted_pnad.py"
      - "data/refined/**"
      - "requirements.txt"
      - ".github/workflows/build_trusted.yml"

permissions:
  contents: write

concurrency:
  group: pnad-trusted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-trusted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Remove obsolete trusted table names
        run: |
          rm -f assets/tables_analysis_trusted/02_build_trusted_pnad__*.csv
          rm -f assets/tables_analysis_trusted/trusted_trim_audit.csv
          rm -f assets/tables_analysis_trusted/trusted_distribution_tests.csv

      - name: Build trusted datasets
        run: python src/stage_02_build_trusted_pnad.py

      - name: Commit trusted datasets and audits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/trusted assets/tables_analysis_trusted
          if git diff --cached --quiet; then
            echo "No trusted-data changes to commit."
          else
            git commit -m "build trusted PNAD datasets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
