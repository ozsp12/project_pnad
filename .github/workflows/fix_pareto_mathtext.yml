name: Fix Pareto mathtext

on:
  push:
    branches: [fix/pareto-mathtext]
    paths:
      - "tools/fix_pareto_mathtext.py"
      - ".github/workflows/fix_pareto_mathtext.yml"

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/pareto-mathtext

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Apply hotfix
        run: python tools/fix_pareto_mathtext.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall src

      - name: Run tests
        run: pytest -q

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stage_03_pnad_analysis.py tests/test_methodology_integrity.py
          git commit -m "fix Pareto mathtext escape"
          git push origin HEAD:fix/pareto-mathtext
