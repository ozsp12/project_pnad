name: Build trusted PNAD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/stage_02_build_trusted_pnad.py"
      - "src/stage_02_prepare_trusted_input.py"
      - "data/refined/**"
      - "data/metadata/df_metadata.csv"
      - ".github/workflows/build_trusted.yml"

permissions:
  contents: write

concurrency:
  group: pnad-trusted-main
  cancel-in-progress: true

jobs:
  build-trusted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build trusted datasets and validation audits
        run: python src/stage_02_prepare_trusted_input.py

      - name: Commit trusted datasets and audits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/trusted assets/tables_validation
          if git diff --cached --quiet; then
            echo "No trusted-data changes to commit."
          else
            git commit -m "build trusted PNAD datasets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
