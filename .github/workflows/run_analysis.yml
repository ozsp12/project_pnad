name: Run PNAD analysis

on:
  push:
    branches: [main]
    paths:
      - "src/stage_03_pnad_analysis.py"
      - ".github/workflows/run_analysis.yml"

permissions:
  contents: write

concurrency:
  group: pnad-analysis-main
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Add observation-year vertical guides
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/stage_03_pnad_analysis.py")
          text = path.read_text()
          old = (
              "        ax.set_xlim(axis_start, last)\n"
              "        ax.set_xticks(np.arange(axis_start, last + 1, 5))\n"
              "        ax.tick_params(axis=\"x\", labelbottom=True)\n"
              "        ax.grid(True, alpha=0.4)"
          )
          new = (
              "        ax.set_xlim(axis_start, last)\n"
              "        major_ticks = np.arange(axis_start, last + 1, 5)\n"
              "        ax.set_xticks(major_ticks)\n"
              "        ax.tick_params(axis=\"x\", labelbottom=True)\n"
              "        ax.grid(True, which=\"major\", color=\"0.82\", linewidth=0.55, linestyle=\"--\", alpha=0.75, zorder=0)\n"
              "        point_years = years[np.isfinite(y.to_numpy(float))]\n"
              "        for year in point_years:\n"
              "            if not np.any(np.isclose(major_ticks, year)):\n"
              "                ax.axvline(year, color=\"0.82\", linewidth=0.55, linestyle=\"--\", alpha=0.75, zorder=0)"
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif "point_years = years[np.isfinite(y.to_numpy(float))]" not in text:
              raise SystemExit("Inequality grid block not found")
          path.write_text(text)
          PY

      - name: Run complete PNAD Stage 03
        env:
          MPLBACKEND: Agg
        run: python src/stage_03_pnad_analysis.py

      - name: Commit analytical assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stage_03_pnad_analysis.py
          git add -A assets/figures_analysis_trusted assets/figures_analysis_refined
          git add -A assets/tables_analysis_trusted assets/tables_analysis_refined
          if ! git diff --cached --quiet; then
            git commit -m "generate PNAD analysis assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
