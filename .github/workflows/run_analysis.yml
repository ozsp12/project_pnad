name: Run PNAD analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/stage_03_pnad_analysis.py"
      - "src/stage_03_pnad_analysis_core.py"
      - "data/metadata/df_metadata.xlsx"
      - "data/auxiliary/**"
      - "data/refined/**"
      - "data/trusted/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: pnad-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure trusted datasets exist
        shell: bash
        run: |
          if ! compgen -G "data/trusted/pnad_trusted_*.parquet" > /dev/null; then
            echo "Trusted datasets are required and are not rebuilt by the analysis workflow."
            echo "Persistent files matching data/trusted/pnad_trusted_*.parquet must be present before analysis."
            exit 1
          fi
          echo "Trusted datasets are present."

      - name: Prepare analysis asset directories
        run: |
          mkdir -p assets/figures_analysis_trusted assets/figures_analysis_refined
          mkdir -p assets/tables_analysis_trusted assets/tables_analysis_refined
          find assets/figures_analysis_trusted -maxdepth 1 -type f -name "*.pdf" -delete
          find assets/figures_analysis_refined -maxdepth 1 -type f -name "*.pdf" -delete
          rm -f assets/figures_analysis_trusted/trusted_analysis_lorenz_indices.svg
          rm -f assets/figures_analysis_refined/refined_analysis_lorenz_indices.svg
          rm -f assets/figures_analysis_trusted/trusted_analysis_regime_fits_gompertz.svg
          rm -f assets/figures_analysis_trusted/trusted_analysis_regime_fits_pareto.svg
          rm -f assets/figures_analysis_refined/refined_analysis_regime_fits_gompertz.svg
          rm -f assets/figures_analysis_refined/refined_analysis_regime_fits_pareto.svg

      - name: Run complete PNAD analysis
        env:
          MPLBACKEND: Agg
        run: python src/stage_03_pnad_analysis.py

      - name: Commit analytical assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/figures_analysis_trusted assets/figures_analysis_refined
          git add -A assets/tables_analysis_trusted assets/tables_analysis_refined
          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
          else
            git commit -m "generate PNAD analysis assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
