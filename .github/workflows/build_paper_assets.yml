name: Build paper assets

on:
  push:
    branches: [main]
    paths:
      - "src/stage_05_publication.py"
      - ".github/workflows/build_paper_assets.yml"

permissions:
  contents: write

concurrency:
  group: pnad-paper-assets-main
  cancel-in-progress: true

jobs:
  paper-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Add observation-year vertical guides
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/stage_05_publication.py")
          text = path.read_text()

          marker = "\n\ndef annotation(ax, text, x=0.05, y=0.06):"
          helper = '''

          def add_observation_guides(ax, years):
              """Add grid-style vertical guides at observed years without adding ticks."""
              major_ticks = np.asarray(ax.get_xticks(), dtype=float)
              observed = sorted({int(year) for year in years if np.isfinite(year)})
              for year in observed:
                  if not np.any(np.isclose(major_ticks, year)):
                      ax.axvline(year, color="0.82", lw=0.55, ls="--", alpha=0.75, zorder=0)
          '''
          helper = "\n".join(line[10:] if line.startswith("          ") else line for line in helper.splitlines())
          if "def add_observation_guides(ax, years):" not in text:
              text = text.replace(marker, helper + marker, 1)

          text = text.replace(
              "    x_tick_start=None,\n    x_tick_step=None,\n):",
              "    x_tick_start=None,\n    x_tick_step=None,\n    observation_guides=False,\n):",
              1,
          )
          text = text.replace(
              "    if title:\n        ax.set_title(title, fontsize=10.0)\n    style(ax)\n    if series:",
              "    if title:\n        ax.set_title(title, fontsize=10.0)\n    style(ax)\n    if observation_guides:\n        finite_mask = np.zeros(len(data), dtype=bool)\n        for column, _ in series:\n            finite_mask |= np.isfinite(pd.to_numeric(data[column], errors=\"coerce\").to_numpy(float))\n        add_observation_guides(ax, data.loc[finite_mask, \"year\"])\n    if series:",
              1,
          )

          anchor = "        x_tick_step=5,\n    )"
          replacement = "        x_tick_step=5,\n        observation_guides=True,\n    )"
          if text.count(anchor) < 3:
              raise SystemExit(f"Expected at least three quinquennial line_figure calls, found {text.count(anchor)}")
          text = text.replace(anchor, replacement, 3)

          text = text.replace(
              "    ax.set_xticks(np.arange(1975, END_YEAR + 1, 5))\n    style(ax)\n    ax.legend(loc=\"best\", ncol=3, handlelength=2.5)",
              "    ax.set_xticks(np.arange(1975, END_YEAR + 1, 5))\n    style(ax)\n    guide_columns = [c for c in (\"Gini\", \"IPEA\", \"Banco_Mundial\") if c in gini_validation]\n    guide_mask = gini_validation[guide_columns].notna().any(axis=1)\n    add_observation_guides(ax, gini_validation.loc[guide_mask, \"year\"])\n    ax.legend(loc=\"best\", ncol=3, handlelength=2.5)",
              1,
          )

          required = [
              "def add_observation_guides(ax, years):",
              "observation_guides=False",
              "observation_guides=True",
              "guide_mask = gini_validation[guide_columns].notna().any(axis=1)",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Patch incomplete: {missing}")
          path.write_text(text)
          PY

      - name: Build Stage 05 publication assets
        env:
          MPLBACKEND: Agg
        run: python src/stage_05_publication.py

      - name: Commit paper assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stage_05_publication.py assets/figures_paper assets/tables_paper
          if ! git diff --cached --quiet; then
            git commit -m "generate paper assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
